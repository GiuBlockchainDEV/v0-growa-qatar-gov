name: Free public commodity price sources
on:
  pull_request:
    paths:
      - 'lib/watchtower/commodity-markets.ts'
      - 'lib/watchtower/world-bank-pink-sheet.ts'
      - 'lib/watchtower/usda-public-reports.ts'
      - 'lib/watchtower/free-commodity-markets.ts'
      - 'lib/watchtower/free-commodity-markets.test.ts'
      - 'app/api/watchtower/commodity-markets/route.ts'
      - 'components/dashboard/watchtower/commodity-markets.tsx'
      - 'components/dashboard/watchtower/commodity-markets.module.css'
      - 'components/dashboard/commodity-public-price-card.tsx'
      - 'components/dashboard/commodity-workspace.tsx'
      - '.github/workflows/free-commodity-prices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Verify no-key market integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Price and source verification tests
        run: npx vitest run lib/watchtower/commodity-markets.test.ts lib/watchtower/free-commodity-markets.test.ts
      - name: Next.js production build
        run: npm run build
      - name: Lint changed source modules
        run: npx eslint lib/watchtower/world-bank-pink-sheet.ts lib/watchtower/usda-public-reports.ts lib/watchtower/free-commodity-markets.ts lib/watchtower/commodity-markets.ts app/api/watchtower/commodity-markets/route.ts components/dashboard/watchtower/commodity-markets.tsx components/dashboard/commodity-public-price-card.tsx
